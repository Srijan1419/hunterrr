name: health

# Daily check that the pipeline still feeds the product. A failed run e-mails the owner (GitHub's own notification).
# Never add pull_request or pull_request_target here: this workflow holds production secrets.
"on":
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'   # 11:00 IST

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      - name: Health check
        run: python -m etl.run health
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
