name: process

# Runs after every collect and on a 30 minute backup schedule.
# Never add pull_request or pull_request_target here: this workflow holds production secrets.
"on":
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    # A cancelled collect has nothing new for us; every other outcome may have stored documents.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HC_PROCESS_URL: ${{ secrets.HC_PROCESS_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'etl/requirements.txt'

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run process
        run: python -m etl.run process
