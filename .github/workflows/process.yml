name: process

# Runs after every collect and on a 30 minute backup schedule.
# Never add pull_request or pull_request_target here: this workflow holds production secrets.
"on":
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: process
  cancel-in-progress: false

jobs:
  process:
    # A cancelled collect has nothing new for us; every other outcome may have stored documents.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HC_PROCESS_URL: ${{ secrets.HC_PROCESS_URL }}
      # The AI rung (rung 4) reads job text only; emails never come near this workflow.
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'etl/requirements.txt'

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      # Boards listed in config/companies.yaml that the database lacks are added (never changed or
      # removed); the next collect run starts polling them.
      - name: Sync company list
        run: python -m etl.run seed

      - name: Run process
        run: python -m etl.run process --batch-size 100 --llm-budget 40 --max-seconds 600

      # Postings extracted by an older rule version get the current rules (no network, no AI);
      # a few runs bring the whole table up to date, then this finds nothing to do.
      - name: Recheck older postings
        run: python -m etl.run recheck --batch-size 500 --max-seconds 150
