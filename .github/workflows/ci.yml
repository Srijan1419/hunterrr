name: ci

# No secrets are used anywhere in this workflow, so it is safe for pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'etl/requirements.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r etl/requirements.txt
      # The database tests start a local PGlite (Postgres) server through node; its packages are not in git.
      - run: npm ci --prefix etl/tests/pglite
      - run: python -m pytest etl/tests -q -m "not live and not pg_concurrent"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'
      - run: npm --prefix web ci
      - run: npm --prefix web run check

  pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hunterrr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PG_CONCURRENT_URL: postgresql+psycopg://postgres:postgres@localhost:5432/hunterrr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'etl/requirements.txt'
      - run: pip install -r etl/requirements.txt
      - name: Apply schema
        # Drizzle's "--> statement-breakpoint" lines are SQL comments, so psql can run the files as they are.
        run: |
          for f in web/drizzle-v2/*.sql; do
            psql "postgresql://postgres:postgres@localhost:5432/hunterrr" -v ON_ERROR_STOP=1 -f "$f"
          done
      - run: python -m pytest etl/tests -q -m pg_concurrent
