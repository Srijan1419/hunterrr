name: collect

# Triggers: cron-job.org calls workflow_dispatch at exact times; the schedule below is the backup.
# Never add pull_request or pull_request_target here: this workflow holds production secrets.
"on":
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

# At WORKFLOW level on purpose: a job-level group would be shared by all 8 matrix shards, which
# would then queue or cancel each other instead of running in parallel.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_ARCHIVE_TOKEN: ${{ secrets.RAW_ARCHIVE_TOKEN }}
      HC_COLLECT_URL: ${{ secrets.HC_COLLECT_URL }}
      RAW_ARCHIVE_REPO: Srijan1419/hunterrr-raw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'etl/requirements.txt'

      - name: Install dependencies
        run: pip install -r etl/requirements.txt

      - name: Run collect
        run: python -m etl.run collect --shard ${{ matrix.shard }}/8
