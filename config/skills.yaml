# Canonical skills Hunterrr understands, for postings and for profiles (one dictionary, so "JS", "javascript" and
# "Java Script" are the same skill). Used by etl/extract/rules/skills.py and by the web profile editor.
#
#   id       stable, lower-case, never reused (it is stored in posting_skills and profiles)
#   label    how it is shown
#   family   the role family it mostly belongs to (see etl/decide/role_family.py), or "general"
#   aliases  other spellings found in postings and resumes (matching ignores case; a skill's label counts too)
#
# Rules for aliases: no bare one- or two-letter word that is also an ordinary word ("go", "r", "c", "it", "sap" is
# fine as an acronym but "go" is not: use "golang"). tests/test_skills_config.py fails on a duplicate id or alias.

