# Companies Hunterrr follows. Edit this file, push, and the next process run adds anything new
# (it never removes or changes a board that is already there).
#
# One line per job board:   - {name: Company, ats: greenhouse|lever|ashby, slug: board-slug}
#
# How to find the slug: open the company's careers page and look at the job-board link.
#   greenhouse   boards.greenhouse.io/<slug>          (or job-boards.greenhouse.io/<slug>)
#   lever        jobs.lever.co/<slug>
#   ashby        jobs.ashbyhq.com/<slug>
# Check one before adding it (it must answer with jobs, not 404):
#   greenhouse   https://boards-api.greenhouse.io/v1/boards/<slug>/jobs
#   lever        https://api.lever.co/v0/postings/<slug>?mode=json
#   ashby        https://api.ashbyhq.com/posting-api/job-board/<slug>
#
# Every board below answered with live postings when it was added (2026-10-06). The comment shows
# the job count and how many titles said intern/fresher/graduate/junior at that time.

